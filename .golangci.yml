# golangci-lint config, MINIMAL tier (golangci-lint v2).
# `default: none` means only the linters listed below run.

version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - gosec
    - govet
    - noctx
    - revive
    - sqlclosecheck
    - staticcheck
  settings:
    staticcheck:
      checks:
        - "all"
        - "-ST1000"

  exclusions:
    rules:
      # Fixture/test-helper paths are built from test-controlled constants and
      # table-driven literals (t.TempDir(), "../testdata/fixtures" + a name from
      # the test's own table), never from anything reaching the binary at
      # runtime; gosec's G304/G703 taint tracking cannot see that boundary.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
