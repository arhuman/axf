# golangci-lint config, MINIMAL tier (golangci-lint v2).
# `default: none` means only the linters listed below run.

version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - govet
    - noctx
    - revive
    - sqlclosecheck
    - staticcheck
  settings:
    staticcheck:
      checks:
        - "all"
        - "-ST1000"

formatters:
  enable:
    - gofmt
