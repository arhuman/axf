# golangci-lint config, MINIMAL tier (golangci-lint v2).
# `default: none` means only the linters listed below run.

version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - gocyclo
    - gosec
    - govet
    - noctx
    - revive
    - sqlclosecheck
    - staticcheck
  settings:
    gocyclo:
      # Generous starting ceiling: today's max in production code is 12
      # ((*Runtime).Up), measured by `gocyclo`. This project's own target is
      # <=10; the gap is tracked, not silently accepted, but a hard floor at
      # exactly today's max would fail the build on a config-only PR. Tighten
      # as Runtime.Up is split or the codebase settles.
      min-complexity: 15
    staticcheck:
      checks:
        - "all"
        - "-ST1000"

  exclusions:
    rules:
      # Fixture/test-helper paths are built from test-controlled constants and
      # table-driven literals (t.TempDir(), "../testdata/fixtures" + a name from
      # the test's own table), never from anything reaching the binary at
      # runtime; gosec's G304/G703 taint tracking cannot see that boundary.
      - path: _test\.go
        linters:
          - gosec
      # Table-driven tests legitimately run long and branchy; gocyclo targets
      # production code (TestParseCanonicalInstanceFields alone measures 34).
      - path: _test\.go
        linters:
          - gocyclo

formatters:
  enable:
    - gofmt
